[package]
name = "editor"
version = "0.1.0"
edition = "2024"

[dependencies]
cassava = { path = "../cassava", version = "0.1.0" }
cxx = "1.0.95"
cxx-qt = "0.9.1"
cxx-qt-lib = { version = "0.9.1", features = ["full"] }
snafu = { workspace = true }

[build-dependencies]
cxx-qt-build = { version = "0.9.1", features = ["link_qt_object_files"] }
