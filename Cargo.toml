[workspace]
resolver = "3"
members = [
  "cassava",
  "editor",
  # "editor-bevy",
  "project",
]

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
snafu = { version = "0.9.0", features = ["unstable-provider-api"] }
glam = { version = "0.33.2", features = ["serde"] }
toml = "1.1.4"
tracing = "0.1.44"

[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3
