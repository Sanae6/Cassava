[package]
name = "cassava"
version = "0.1.0"
edition = "2024"

[dependencies]
atomic_refcell = "0.1.14"
bitfield-struct = "0.13.0"
bitmatch = "0.1.1"
bytemuck = "1.25.0"
byteordered = "0.6.0"
glam = { version = "0.33.0", features = ["bytemuck"] }
heapless = "0.9.3"
indexmap = "2.14.0"
num-derive = "0.4.2"
num-traits = "0.2.19"
ordered-float = "5.3.0"
paste = "1.0.15"
pathdiff = "0.2.3"
serde = { workspace = true }
smol_str = "0.3.6"
snafu = { workspace = true }
tegra_swizzle = "0.4.0"
tracing.workspace = true

[dev-dependencies]
clap = { workspace = true }
ddsfile = "0.6.0"
gltf = "1.4.1"
gltf-json = "1.4.1"
image = { version = "*", features = ["png"] }
itertools = "0.15.0"
serde = { workspace = true }
serde_json = "1.0.151"
szs = "0.3.7"
tracing-subscriber = "0.3.23"
