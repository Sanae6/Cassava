[package]
name = "cassava"
version = "0.1.0"
edition = "2024"

[dependencies]
bitfield-struct = "0.13.0"
bytemuck = "1.25.0"
byteordered = "0.6.0"
glam = { version = "0.33.0", features = ["bytemuck"] }
num-derive = "0.4.2"
num-traits = "0.2.19"
ordered-float = "5.3.0"
pathdiff = "0.2.3"
serde = { workspace = true }
snafu = { workspace = true }
tegra_swizzle = "0.4.0"

[dev-dependencies]
clap = { version = "4.6.1", features = ["derive"] }
ddsfile = "0.6.0"
gltf = "1.4.1"
gltf-json = "1.4.1"
image = { version = "0.25.10", features = ["png"] }
serde = "1.0.228"
serde_json = "1.0.151"
