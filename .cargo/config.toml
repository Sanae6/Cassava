[target.x86_64-unknown-linux-gnu]
rustflags = [
  "-C", "link-arg=-fuse-ld=lld",
  # (Nightly) Make the current crate share its generic instantiations
  "-Zshare-generics=y",
]
linker = "clang"

[env]
TS_RS_EXPORT_DIR = { value = "editor-web/svelte/bindings", relative = true }
TS_RS_LARGE_INT = "object"
